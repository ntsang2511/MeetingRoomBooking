# Profile dùng khi triển khai thật: không có giá trị mặc định cho bí mật,
# thiếu biến môi trường thì ứng dụng dừng ngay khi khởi động.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
