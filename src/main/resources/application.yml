spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
    expiration-minutes: 60
  admin:
    email: ${ADMIN_EMAIL:admin@company.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
  booking:
    timezone: ${BOOKING_TIMEZONE:Asia/Ho_Chi_Minh}
    work-start: "${BOOKING_WORK_START:08:00}"
    work-end: "${BOOKING_WORK_END:18:00}"
    min-duration-minutes: 15
    max-duration-minutes: 480
    max-advance-days: ${BOOKING_MAX_ADVANCE_DAYS:60}

management:
  endpoints:
    web:
      exposure:
        include: health